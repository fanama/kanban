{{define "index.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{if .Board.Name}}{{.Board.Name}} · {{end}}Kanban</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.classList.add('js');</script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="/static/vendor/marked.min.js?v=15.0.7" defer></script>
  <script src="/static/vendor/purify.min.js?v=3.2.4" defer></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#board">Skip to the board</a>

  <header class="topbar">
    <div class="topbar-brand">
      <button type="button" class="icon-button sidebar-toggle" id="sidebar-toggle"
              aria-controls="sidebar" aria-expanded="false" aria-label="Show boards and columns">
        <span aria-hidden="true">☰</span>
      </button>
      <span class="brand-mark" aria-hidden="true">K</span>
      <span class="brand-name">Kanban</span>
      <span id="live-status" class="live-status" data-state="connecting" aria-live="polite">
        <span class="live-dot" aria-hidden="true"></span>
        <span>Connecting…</span>
      </span>
    </div>

    <div class="topbar-actions">
      <button type="button" id="actor-chip" class="actor-chip" title="Change your display name">Someone</button>
      <details class="menu board-tools">
        <summary class="button subtle">Board tools</summary>
        <div class="menu-panel">
          <form action="/import.json" method="post" enctype="multipart/form-data"
                hx-post="/import.json" hx-encoding="multipart/form-data"
                hx-target="#board" hx-swap="outerHTML" class="import-form">
            <label class="field-label" for="import-file">Load a board</label>
            <input id="import-file" type="file" name="file" accept=".json,application/json" required>
            <button type="submit" class="button primary">Load board…</button>
          </form>
          <a href="/export.json" download="kanban-board.json" class="button">Export JSON</a>
        </div>
      </details>
    </div>

    <p id="flash" class="flash" role="status" hidden></p>
  </header>

  {{template "board" .}}

  <dialog id="card-dialog" class="card-dialog" aria-labelledby="card-dialog-label">
    <div class="dialog-head">
      <span class="eyebrow" id="card-dialog-label">Card</span>
      <button type="button" class="icon-button" data-dialog-close aria-label="Close the card">✕</button>
    </div>
    <p id="dialog-flash" class="form-error" role="alert" hidden></p>
    <div id="card-dialog-body" class="dialog-body"></div>
  </dialog>

  <dialog id="name-dialog" class="card-dialog name-dialog">
    <div class="dialog-head">
      <span class="eyebrow">Your name</span>
    </div>
    <p class="muted">What should teammates call you in live notifications?</p>
    <input id="name-input" type="text" maxlength="40" placeholder="Your display name" autocomplete="nickname">
    <div class="form-actions">
      <button type="button" id="name-save" class="button primary">Save</button>
      <button type="button" id="name-skip" class="button subtle">Skip</button>
    </div>
  </dialog>

  <dialog id="conflict-dialog" class="card-dialog conflict-dialog">
    <div class="dialog-head">
      <span class="eyebrow">Concurrent edit</span>
    </div>
    <p id="conflict-text"></p>
    <div class="form-actions">
      <button type="button" id="conflict-reload" class="button">Reload</button>
      <button type="button" id="conflict-overwrite" class="button danger">Overwrite</button>
      <button type="button" id="conflict-keep" class="button subtle">Keep editing</button>
    </div>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" role="status"></div>
</body>
</html>
{{end}}
