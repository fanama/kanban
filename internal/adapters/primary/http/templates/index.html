{{define "index.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{if .Board.Name}}{{.Board.Name}} · {{end}}Kanban</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.classList.add('js');</script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#board">Skip to the board</a>

  <header class="topbar">
    <div class="topbar-brand">
      <button type="button" class="icon-button sidebar-toggle" id="sidebar-toggle"
              aria-controls="sidebar" aria-expanded="false" aria-label="Show boards and columns">
        <span aria-hidden="true">☰</span>
      </button>
      <span class="brand-mark" aria-hidden="true">K</span>
      <span class="brand-name">Kanban</span>
    </div>

    <details class="menu board-tools">
      <summary class="button subtle">Board tools</summary>
      <div class="menu-panel">
        <form action="/import.json" method="post" enctype="multipart/form-data"
              hx-post="/import.json" hx-encoding="multipart/form-data"
              hx-target="#board" hx-swap="outerHTML" class="import-form">
          <label class="field-label" for="import-file">Load a board</label>
          <input id="import-file" type="file" name="file" accept=".json,application/json" required>
          <button type="submit" class="button primary">Load board…</button>
        </form>
        <a href="/export.json" download="kanban-board.json" class="button">Export JSON</a>
      </div>
    </details>

    <p id="flash" class="flash" role="status" hidden></p>
  </header>

  {{template "board" .}}

  <dialog id="card-dialog" class="card-dialog" aria-labelledby="card-dialog-label">
    <div class="dialog-head">
      <span class="eyebrow" id="card-dialog-label">Card</span>
      <button type="button" class="icon-button" data-dialog-close aria-label="Close the card">✕</button>
    </div>
    <p id="dialog-flash" class="form-error" role="alert" hidden></p>
    <div id="card-dialog-body" class="dialog-body"></div>
  </dialog>

  <script>
    (function () {
      const body = document.body;
      const flash = document.getElementById('flash');
      const dialog = document.getElementById('card-dialog');
      const dialogBody = document.getElementById('card-dialog-body');
      const dialogFlash = document.getElementById('dialog-flash');

      function showError(message) {
        if (!message) return;
        if (flash) { flash.textContent = message; flash.hidden = false; }
        if (dialogFlash && dialog && dialog.open) { dialogFlash.textContent = message; dialogFlash.hidden = false; }
      }
      function clearError() {
        if (flash) { flash.textContent = ''; flash.hidden = true; }
        if (dialogFlash) { dialogFlash.textContent = ''; dialogFlash.hidden = true; }
      }

      // The server sends the reason as plain text on 4xx/5xx; surface it
      // instead of silently keeping the old board.
      body.addEventListener('htmx:responseError', function (e) {
        showError(e.detail.xhr.responseText.trim());
      });
      // Any successful mutation re-renders the board behind the dialog, so the
      // dialog would otherwise show stale content.
      body.addEventListener('htmx:afterRequest', function (e) {
        if (!e.detail.successful) return;
        clearError();
        const verb = e.detail.requestConfig && e.detail.requestConfig.verb;
        if (verb !== 'get') closeDialog();
      });

      // --- sidebar drawer (mobile) -----------------------------------------
      const sidebarToggle = document.getElementById('sidebar-toggle');
      function setSidebar(open) {
        body.classList.toggle('sidebar-open', open);
        if (sidebarToggle) sidebarToggle.setAttribute('aria-expanded', String(open));
      }
      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function () {
          setSidebar(!body.classList.contains('sidebar-open'));
        });
      }
      document.addEventListener('click', function (e) {
        if (e.target.closest('[data-sidebar-close]')) setSidebar(false);
        if (e.target.closest('#sidebar a.board-tab')) setSidebar(false);
        if (!e.target.closest('details.menu')) {
          document.querySelectorAll('details.menu[open]').forEach(function (m) { m.open = false; });
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setSidebar(false);
      });

      // --- read-only card dialog -------------------------------------------
      function closeDialog() {
        if (dialog && dialog.open) dialog.close();
        if (dialogBody) dialogBody.innerHTML = '';
      }
      document.addEventListener('click', async function (e) {
        const opener = e.target.closest('[data-card-open]');
        if (!opener) return;
        e.preventDefault();
        if (!dialog || !dialogBody) return;
        try {
          const res = await fetch('/cards/' + encodeURIComponent(opener.dataset.cardOpen), {
            headers: { 'HX-Request': 'true' }
          });
          if (!res.ok) { showError((await res.text()).trim()); return; }
          clearError();
          dialogBody.innerHTML = await res.text();
          if (window.htmx) window.htmx.process(dialogBody);
          if (typeof dialog.showModal === 'function') dialog.showModal();
          else dialog.setAttribute('open', '');
        } catch (err) {
          showError('Could not open the card. Try again.');
        }
      });
      document.addEventListener('click', function (e) {
        if (e.target.closest('[data-dialog-close]')) closeDialog();
      });
      if (dialog) {
        dialog.addEventListener('click', function (e) {
          if (e.target === dialog) closeDialog();
        });
        dialog.addEventListener('close', function () {
          if (dialogBody) dialogBody.innerHTML = '';
          clearError();
        });
      }

      // --- native drag and drop (desktop) ----------------------------------
      // A card may only land in an adjacent column: always the previous one,
      // and the next one only when the stage rule allows the advance. The
      // server still owns the final decision.
      let dragged = null;
      function clearDragState() {
        document.querySelectorAll('.column.drop-ok').forEach(function (c) { c.classList.remove('drop-ok'); });
        document.querySelectorAll('.card.dragging').forEach(function (c) { c.classList.remove('dragging'); });
        dragged = null;
      }
      function accepts(columnId) {
        if (!dragged) return false;
        if (columnId === dragged.dataset.prevColumn) return true;
        return columnId === dragged.dataset.nextColumn && dragged.dataset.canAdvance === 'true';
      }
      document.addEventListener('dragstart', function (e) {
        const card = e.target.closest('article.card[data-card-id]');
        if (!card || card.classList.contains('card-form')) { e.preventDefault(); return; }
        dragged = card;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', card.dataset.cardId);
      });
      document.addEventListener('dragend', clearDragState);
      document.addEventListener('dragover', function (e) {
        const column = e.target.closest('.column[data-column-id]');
        if (!column || !dragged) return;
        if (accepts(column.dataset.columnId)) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          document.querySelectorAll('.column.drop-ok').forEach(function (c) {
            if (c !== column) c.classList.remove('drop-ok');
          });
          column.classList.add('drop-ok');
        } else {
          column.classList.remove('drop-ok');
        }
      });
      document.addEventListener('dragleave', function (e) {
        const column = e.target.closest('.column[data-column-id]');
        if (column && !column.contains(e.relatedTarget)) column.classList.remove('drop-ok');
      });
      document.addEventListener('drop', function (e) {
        const column = e.target.closest('.column[data-column-id]');
        if (!column || !dragged) return;
        e.preventDefault();
        const cardId = dragged.dataset.cardId;
        const columnId = column.dataset.columnId;
        const allowed = accepts(columnId);
        clearDragState();
        if (!allowed) return;
        if (window.htmx) {
          window.htmx.ajax('POST', '/cards/move', {
            target: '#board',
            swap: 'outerHTML',
            values: { card_id: cardId, column_id: columnId }
          });
        }
      });
    })();
  </script>
</body>
</html>
{{end}}
